<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f3f4f9; color: #1a1c1e; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { background-color: #156b3e; padding: 30px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        .content { padding: 40px 30px; text-align: center; }
        .content h2 { margin-top: 0; color: #1a1c1e; font-size: 22px; }
        .content p { font-size: 16px; line-height: 1.5; color: #43474e; margin-bottom: 25px; }
        .code-box { display: inline-block; background-color: #f8f9fc; border: 2px dashed #156b3e; border-radius: 8px; padding: 15px 30px; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #156b3e; margin-bottom: 25px; }
        .footer { background-color: #f8f9fc; padding: 20px; text-align: center; font-size: 13px; color: #74777f; border-top: 1px solid #e0e3e5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CityWatch</h1>
        </div>
        <div class="content">
            <h2>Your Verification Code</h2>
            <p>Use the code below to complete your <strong>{{ action }}</strong>. This code will expire in 10 minutes.</p>
            <div class="code-box">{{ code }}</div>
            <p style="font-size: 14px; color: #74777f;">If you didn't request this code, you can safely ignore this email.</p>
        </div>
        <div class="footer">
            &copy; {% now "Y" %} CityWatch. All rights reserved.
        </div>
    </div>
</body>
</html>
