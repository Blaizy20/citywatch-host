<style>
  #resident-announcement-dialog {
    width: min(44rem, calc(100vw - 2rem));
    max-width: none;
    max-height: min(88dvh, 52rem);
    padding: 0;
    overflow: visible;
    border: 0;
    background: transparent;
    color: inherit;
  }
  #resident-announcement-dialog::backdrop {
    background: rgb(13 20 18 / 48%);
    backdrop-filter: blur(5px);
    animation: announcementBackdropIn 220ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .announcement-dialog-panel {
    max-height: min(88dvh, 52rem);
    padding: 0.5rem;
    overflow: auto;
    border: 1px solid #c4c6cf;
    border-radius: 0.75rem;
    background: #ffffff;
    box-shadow: 0 24px 70px rgb(0 0 0 / 24%);
    opacity: 1;
    transform: scale(1);
    animation: announcementPanelIn 220ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  @keyframes announcementBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes announcementPanelIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    #resident-announcement-dialog::backdrop,
    .announcement-dialog-panel { animation-duration: 1ms; }
    .announcement-dialog-panel { transform: none; }
  }
</style>
<dialog id="resident-announcement-dialog" aria-label="Announcement details" aria-busy="false">
  <div class="announcement-dialog-panel">
    <div class="sticky top-0 z-10 flex justify-end border-b border-outline-variant bg-surface-container-lowest/95 px-3 py-2">
      <button type="button" id="close-announcement-dialog" aria-label="Close announcement" class="flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>
    <div id="announcement-dialog-content" class="min-h-40">
      <div class="flex min-h-40 items-center justify-center p-8 text-sm text-on-surface-variant" role="status">Loading update...</div>
    </div>
  </div>
</dialog>
<script>
(() => {
  const dialog = document.getElementById('resident-announcement-dialog');
  const content = document.getElementById('announcement-dialog-content');
  const closeButton = document.getElementById('close-announcement-dialog');
  if (!dialog || !content || !closeButton || !dialog.showModal) return;

  document.addEventListener('click', async (event) => {
    const trigger = event.target instanceof Element
      ? event.target.closest('[data-announcement-dialog]')
      : null;
    if (!trigger) return;

    event.preventDefault();
    const url = trigger.href;
    content.innerHTML = '<div class="flex min-h-40 items-center justify-center p-8 text-sm text-on-surface-variant" role="status">Loading update...</div>';
    dialog.setAttribute('aria-busy', 'true');
    dialog.showModal();

    try {
      const response = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      if (!response.ok) throw new Error('The update could not be loaded.');
      const page = new DOMParser().parseFromString(await response.text(), 'text/html');
      const article = page.querySelector('#announcement-detail-content');
      if (!article) throw new Error('The update content was not found.');
      content.replaceChildren(article.cloneNode(true));
    } catch {
      const message = document.createElement('p');
      message.className = 'p-6 text-sm text-on-surface-variant';
      message.textContent = 'This update could not be loaded. Please try again.';
      content.replaceChildren(message);
    } finally {
      dialog.setAttribute('aria-busy', 'false');
    }
  });

  closeButton.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });
})();
</script>
